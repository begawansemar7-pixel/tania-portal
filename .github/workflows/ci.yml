name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  # A superseded run tells you nothing; cancel it and keep the queue short.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  verify:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `--ignore-scripts` keeps a compromised dependency from running code at
      # install time; Prisma's generate is invoked explicitly below.
      - run: npm ci --ignore-scripts
      - run: npm --workspace @tania/api run prisma:generate

      - run: npm run verify

  e2e:
    name: Backend end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # A real PostgreSQL, because the `embedded-postgres` the suite uses locally
    # cannot start here: its bundled `initdb` is linked against libicuuc.so.60,
    # which Ubuntu 24.04 runners do not ship, and it exits 127 before the first
    # test. The suite takes whichever one it is given.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: tania
          POSTGRES_PASSWORD: tania
          POSTGRES_DB: tania_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tania -d tania_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts
      - run: npm --workspace @tania/api run prisma:generate

      - run: npm run test:e2e
        env:
          E2E_DATABASE_URL: postgresql://tania:tania@localhost:5432/tania_e2e?schema=public

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      # Fails on any high or critical advisory in production dependencies that
      # is not recorded in security/audit-exceptions.json, and on any recorded
      # exception whose expiry has passed. Plain `npm audit --audit-level=high`
      # stayed red on four unfixable transitives inside the Prisma CLI subtree,
      # and a job that is always red is a job nobody reads.
      - run: npm run audit

  interop:
    name: Adapter against the real runtime
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [verify]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts
      - run: npm --workspace @tania/api run prisma:generate

      # Proves the two halves of the JarvisCommand contract agree over a real
      # socket. Both compile against @tania/types, so a failure here means the
      # wire format drifted from the declarations.
      - run: npm run test:interop

  smoke:
    name: Smoke test the built portal
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [verify]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts
      - run: npm --workspace @tania/api run prisma:generate

      # The production artefact, not a dev server: this job exists to catch what
      # only appears once the app is built and listening on a socket. A guard
      # that rejected every real user behind an ingress passed lint, typecheck,
      # six hundred unit tests and a code review — and failed the first HTTP
      # call against a running build.
      - run: npm run build

      - run: npm run test:smoke

  docker:
    name: Container images
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [verify]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Built but not pushed: publishing is a deployment decision, and this
      # workflow only proves the images assemble.
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
